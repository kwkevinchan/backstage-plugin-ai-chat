openapi: 3.1.0
info:
  title: ai-chat
  version: '1'
  description: |-
    The HTTP API of the AI chat backend plugin for Backstage (`@kwkevinchan/backstage-plugin-ai-chat-backend`).

    The paths are relative to the base URL of the plugin, `/api/ai-chat` in a default backend. Every route needs the Backstage credentials of a signed-in user (a user token from the identity API); a service token is refused with 403. A session belongs to the user who created it: another user gets 404 for it, as for a session that does not exist.

    The routes that answer with `text/event-stream` send the AI SDK UI message stream (`ai@7`, header `x-vercel-ai-ui-message-stream: v1`): each event is a line `data: <JSON>` followed by an empty line, and the stream ends with `data: [DONE]`. A request that is refused before anything is sent (400, 404, 409, 503) gets a normal JSON error. A run that fails sends the transient `data-run` part (`status: failed`) and then an `error` part with a fixed text, and no `finish`; a run that is cancelled sends `data-run` and `abort`; a run that waits for an approval sends a `tool-approval-request` for every call that waits, `data-run` and `finish` with `finishReason: tool-calls`. The text of an error of the model server is never sent.

    A run is one pass of the agent loop over one message. The stream of a run has one assistant message, with the id `run_<runId>`; the streams that continue the run (after an approval, after a reload) start with the same id.

    An action that is not read-only never runs without a decision of the owner: the call waits (`tool-approval-request`) until the decision route stores a decision, and the action runs with the input that was stored when the model asked for the call.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  contact: {}
servers:
  - url: /
tags:
  - name: Sessions
    description: The sessions of the signed-in user.
  - name: Runs
    description: Routes that start, continue or follow a run, and answer with a stream.
  - name: Attachments
    description: The images of the messages of a session. Only the owner of the session uploads and reads them.
  - name: Input
    description: What a message may carry.
  - name: Queue
    description: Messages that wait for the run of a session to end, and are sent as a new run when it ends well.
  - name: Toolsets
    description: The groups of tools the user can switch on in a session.
security:
  - JWT: []
components:
  securitySchemes:
    JWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    sessionId:
      name: id
      in: path
      required: true
      description: ID of the session.
      schema:
        type: string
    runId:
      name: runId
      in: path
      required: true
      description: ID of the run.
      schema:
        type: string
    callId:
      name: callId
      in: path
      required: true
      description: ID of the tool call (`callId` of the `tool_call` item). It is also the `approvalId` of the stream.
      schema:
        type: string
    queuedId:
      name: queuedId
      in: path
      required: true
      description: ID of the queued message.
      schema:
        type: string
    afterSeq:
      name: afterSeq
      in: query
      required: false
      description: 'Leave out the items up to this `seq`. On `GET /sessions/{id}/stream`, a client that uses `useChat` of the AI SDK must not send it: the SDK finds a tool part only when the stream carries the whole run, so a stream that leaves items out loses the tool parts.'
      allowReserved: true
      schema:
        type: integer
        minimum: 0
  responses:
    Error:
      description: An error, with the body of the Backstage backend.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Stream:
      description: 'A UI message stream, `text/event-stream`, with the response header `x-vercel-ai-ui-message-stream: v1`. The parts: `start`, `start-step`, `text-start`, `text-delta`, `text-end`, `tool-input-available`, `tool-approval-request`, `tool-approval-response`, `tool-output-available`, `tool-output-error`, `tool-output-denied`, `finish-step`, `finish`, `error`, `abort`, and the data parts `data-run`, `data-item`, `data-notice` (all three transient) and `data-plan`, and the data parts `data-inserted` (a message that was inserted into the run, read by the model; it is part of the message and has the id `inserted-<seq>`) and `data-queue` (transient; the queue when the run ended, before `data-run`).'
      content:
        text/event-stream:
          schema:
            type: string
    NoContent:
      description: There is nothing to stream.
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            name:
              type: string
              description: 'The name of the error. The errors of the input phase keep their own name, so a client can tell apart errors of one status: `RunNotRunning`, `InsertLimitReached`, `NoActiveRun`, `QueueFull`, `QueueChanged`, `TooManyPendingAttachments` (409), `QueuedMessageNotFound`, `AttachmentNotFound` (404, or 400 when a message names an image that is not in the session), `UnsupportedAttachmentType` (415), `AttachmentTooLarge` (413), and `InvalidAttachment`, `TooManyAttachments`, `ImagesNotSupported`, `TooManyImageBytes` (400).'
            message:
              type: string
          required: [name, message]
        request:
          type: object
          properties:
            method:
              type: string
            url:
              type: string
        response:
          type: object
          properties:
            statusCode:
              type: integer
      required: [error]
    ChatAttachment:
      type: object
      description: An image of a message. The bytes are read with `GET /sessions/{id}/attachments/{attachmentId}`.
      properties:
        id:
          type: string
        mediaType:
          type: string
          enum: [image/png, image/jpeg, image/webp, image/gif]
        name:
          type: string
          maxLength: 255
        size:
          type: integer
          description: Bytes.
      required: [id, mediaType, name, size]
    ChatInputConfig:
      type: object
      properties:
        images:
          type: object
          properties:
            enabled:
              type: boolean
              description: Whether the model reads images (`aiChat.llm.images`). When it is false, the upload and a message with images are refused with 400 `ImagesNotSupported`.
            mediaTypes:
              type: array
              items:
                type: string
            maxPerMessage:
              type: integer
            maxBytes:
              type: integer
              description: The largest image, in bytes.
            maxBytesPerInput:
              type: integer
              description: The most image bytes in the messages of one run.
            maxPendingPerSession:
              type: integer
              description: The most images of a session that are in no message yet.
          required:
            [
              enabled,
              mediaTypes,
              maxPerMessage,
              maxBytes,
              maxBytesPerInput,
              maxPendingPerSession,
            ]
        insertMaxPerRun:
          type: integer
        queueMaxMessages:
          type: integer
      required: [images, insertMaxPerRun, queueMaxMessages]
    ChatPageContext:
      type: object
      description: The page the user is on, as the client says it. The model gets it as one line before the text of the message, and the log keeps it with the message; that is why the form is checked.
      properties:
        path:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: '^/[^\s\x00-\x1f\x7f]*$'
          description: A path that starts with `/`; no blank and no control character. The server also refuses Unicode control and format characters (category C), which the pattern does not show.
        entityRef:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^(?:[A-Za-z][A-Za-z0-9]*:)?(?:[a-z0-9]+(?:-+[a-z0-9]+)*/)?(?:[A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9]$'
          description: An entity reference, `[kind:][namespace/]name`, with the characters and the lengths (63 for each part) that `@backstage/catalog-model` allows. The client gives it, and the backend checks the form before the model reads it.
      required: [path]
    ChatSession:
      type: object
      properties:
        id:
          type: string
        ownerRef:
          type: string
        agentId:
          type: string
        title:
          type: string
        entityRef:
          type: string
          description: The entity the session was opened for.
        enabledToolsets:
          type: array
          items:
            type: string
        pinned:
          type: boolean
        archivedAt:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        [id, ownerRef, agentId, enabledToolsets, pinned, createdAt, updatedAt]
    ChatRun:
      type: object
      properties:
        id:
          type: string
        sessionId:
          type: string
        status:
          type: string
          enum:
            [running, waiting_approval, completed, failed, cancelled, expired]
        cancelRequested:
          type: boolean
        endReason:
          type: string
        startedAt:
          type: string
        endedAt:
          type: string
      required: [id, sessionId, status, cancelRequested, startedAt]
    ChatItem:
      description: 'One entry of the log of a session, discriminated by `kind`. `seq` grows by one with each item of the session. A `summary` item is for the model, not for the screen.'
      oneOf:
        - $ref: '#/components/schemas/UserMessageItem'
        - $ref: '#/components/schemas/AgentMessageItem'
        - $ref: '#/components/schemas/ToolCallItem'
        - $ref: '#/components/schemas/ApprovalItem'
        - $ref: '#/components/schemas/ToolStartedItem'
        - $ref: '#/components/schemas/ToolResultItem'
        - $ref: '#/components/schemas/PlanUpdateItem'
        - $ref: '#/components/schemas/SummaryItem'
        - $ref: '#/components/schemas/NoteItem'
      discriminator:
        propertyName: kind
    ItemBase:
      type: object
      properties:
        sessionId:
          type: string
        seq:
          type: integer
        runId:
          type: string
        createdAt:
          type: string
      required: [sessionId, seq, createdAt]
    UserMessageItem:
      allOf:
        - $ref: '#/components/schemas/ItemBase'
        - type: object
          properties:
            kind:
              const: user_message
            text:
              type: string
            attachments:
              type: array
              items:
                $ref: '#/components/schemas/ChatAttachment'
            page:
              $ref: '#/components/schemas/ChatPageContext'
            delivery:
              type: string
              enum: [direct, inserted, queued]
              description: How the message reached its run. A message with no value is `direct`.
            insertState:
              $ref: '#/components/schemas/ChatInsertState'
          required: [kind, text]
    ChatInsertState:
      type: string
      enum: [read, pending, unread]
      description: 'Whether the model read an inserted message, in the answer of `GET /sessions/{id}`: `read`; `pending` (not read yet, the run goes on); `unread` (the run ended without reading it).'
    AgentMessageItem:
      allOf:
        - $ref: '#/components/schemas/ItemBase'
        - type: object
          properties:
            kind:
              const: agent_message
            text:
              type: string
            readUpToSeq:
              type: integer
              description: The largest `seq` the model had read when it began this answer.
          required: [kind, text]
    ToolCallItem:
      allOf:
        - $ref: '#/components/schemas/ItemBase'
        - type: object
          properties:
            kind:
              const: tool_call
            callId:
              type: string
            toolId:
              type: string
              description: The ID of the action in the actions registry, for example `catalog:get-catalog-entity`.
            input:
              type: object
              description: The exact input that runs when the call is allowed.
              additionalProperties: true
            schemaHash:
              type: string
            policy:
              type: string
              enum: [allow, ask]
            readOnly:
              type: boolean
            step:
              type: integer
            position:
              type: integer
            readUpToSeq:
              type: integer
              description: The largest `seq` the model had read when it began the answer that asked for this call.
          required:
            [
              kind,
              callId,
              toolId,
              input,
              schemaHash,
              policy,
              readOnly,
              step,
              position,
            ]
    ApprovalItem:
      allOf:
        - $ref: '#/components/schemas/ItemBase'
        - type: object
          properties:
            kind:
              const: approval
            callId:
              type: string
            decision:
              type: string
              enum: [allow, deny]
            decidedBy:
              type: string
          required: [kind, callId, decision, decidedBy]
    ToolStartedItem:
      allOf:
        - $ref: '#/components/schemas/ItemBase'
        - type: object
          properties:
            kind:
              const: tool_started
            callId:
              type: string
          required: [kind, callId]
    ToolResultItem:
      allOf:
        - $ref: '#/components/schemas/ItemBase'
        - type: object
          properties:
            kind:
              const: tool_result
            callId:
              type: string
            status:
              type: string
              enum: [ok, error, timeout, denied, invalid, unknown]
            output:
              description: The output of the action. When it was cut, `truncated` is true.
            truncated:
              type: boolean
            message:
              type: string
          required: [kind, callId, status]
    PlanUpdateItem:
      allOf:
        - $ref: '#/components/schemas/ItemBase'
        - type: object
          properties:
            kind:
              const: plan_update
            plan:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      text:
                        type: string
                      status:
                        type: string
                        enum: [pending, in_progress, completed]
                    required: [text, status]
              required: [items]
          required: [kind, plan]
    SummaryItem:
      allOf:
        - $ref: '#/components/schemas/ItemBase'
        - type: object
          properties:
            kind:
              const: summary
            coversUpToSeq:
              type: integer
            text:
              type: string
          required: [kind, coversUpToSeq, text]
    NoteItem:
      allOf:
        - $ref: '#/components/schemas/ItemBase'
        - type: object
          properties:
            kind:
              const: note
            text:
              type: string
          required: [kind, text]
    ChatSessionDetail:
      type: object
      properties:
        session:
          $ref: '#/components/schemas/ChatSession'
        run:
          $ref: '#/components/schemas/ChatRun'
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChatItem'
        awaitingDecision:
          type: array
          description: The IDs of the tool calls that wait for a decision of the user. Not limited by `afterSeq`. Empty unless the run waits for an approval.
          items:
            type: string
        resumable:
          type: boolean
          description: The run waits for an approval and no call is left to decide, so the loop did not start after the last decision. `POST /sessions/{id}/resume` carries it on.
        queue:
          $ref: '#/components/schemas/ChatQueue'
      required: [session, items, awaitingDecision, resumable, queue]
    ChatQueuedMessage:
      type: object
      properties:
        id:
          type: string
        position:
          type: integer
          minimum: 1
          description: From 1, in the order the messages are sent.
        text:
          type: string
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/ChatAttachment'
        page:
          $ref: '#/components/schemas/ChatPageContext'
        createdAt:
          type: string
        updatedAt:
          type: string
      required: [id, position, text, createdAt, updatedAt]
    ChatQueue:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChatQueuedMessage'
        paused:
          type: boolean
          description: The session has no run that has not ended and the queue is not empty. Nothing is sent until `POST /sessions/{id}/queue/resume`.
      required: [items, paused]
    ChatTool:
      type: object
      properties:
        id:
          type: string
          description: The ID of the action in the actions registry; it names a call.
        title:
          type: string
        description:
          type: string
        readOnly:
          type: boolean
          description: Whether the tool only reads. Any other tool asks for approval.
      required: [id, description, readOnly]
    ChatToolset:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        default:
          type: boolean
          description: Whether a new session has it switched on.
        egress:
          type: boolean
          description: Whether its tools send data out of the organization.
      required: [id, default, egress]
paths:
  /sessions:
    get:
      operationId: listSessions
      tags: [Sessions]
      summary: List the sessions of the user, the most recently changed first.
      description: Only the sessions that the signed-in user owns. Archived sessions are left out unless `includeArchived` is `true`.
      parameters:
        - name: includeArchived
          in: query
          allowReserved: true
          schema:
            type: string
            enum: ['true', 'false']
        - name: limit
          in: query
          allowReserved: true
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: The sessions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ChatSession'
                required: [items]
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
    post:
      operationId: createSession
      tags: [Sessions]
      summary: Create an empty session.
      description: Without `enabledToolsets` the session has the toolsets that are on by default. 400 for a toolset or an agent that does not exist.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                agentId:
                  type: string
                title:
                  type: string
                  minLength: 1
                  maxLength: 200
                entityRef:
                  type: string
                enabledToolsets:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: The new session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSession'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /sessions/{id}:
    parameters:
      - $ref: '#/components/parameters/sessionId'
    get:
      operationId: getSession
      tags: [Sessions]
      summary: Read a session with its items and its run that has not ended.
      description: Only the owner reads a session; anyone else gets 404. Use `afterSeq` to read only the items that are new.
      parameters:
        - $ref: '#/components/parameters/afterSeq'
      responses:
        '200':
          description: The session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSessionDetail'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateSession
      tags: [Sessions]
      summary: Change the title, the pin, the archive state or the toolsets of a session.
      description: Only the fields in the body change. 400 for a toolset that does not exist.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type:
                    - string
                    - 'null'
                  minLength: 1
                  maxLength: 200
                  description: '`null` removes the title.'
                pinned:
                  type: boolean
                archived:
                  type: boolean
                enabledToolsets:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: The session after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSession'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteSession
      tags: [Sessions]
      summary: Delete a session with its runs and items.
      description: 409 while a run of the session has not ended.
      responses:
        '204':
          description: Deleted.
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /input-config:
    get:
      operationId: getInputConfig
      tags: [Input]
      summary: Read what a message may carry.
      description: The limits on images and whether the model reads them, and the limits of the inserted and the queued messages. A client checks an image against it before it uploads.
      responses:
        '200':
          description: The settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatInputConfig'
        '403':
          $ref: '#/components/responses/Error'
  /sessions/{id}/attachments:
    parameters:
      - $ref: '#/components/parameters/sessionId'
    post:
      operationId: uploadAttachment
      tags: [Attachments]
      summary: Upload an image to a session.
      description: 'The request body is the bytes of the image, with no multipart form, and `Content-Type` is `image/png`, `image/jpeg`, `image/webp` or `image/gif`. (It is not described as a `requestBody` here: the OpenAPI lint of Backstage repo-tools asks every request body to offer `application/json`, which this one does not.) The owner and the type are checked before the body is read. 413 `AttachmentTooLarge` when `Content-Length` is over `aiChat.input.images.maxBytes` (before a byte is read), or when a body with no `Content-Length` grows over it (reading stops, and the connection is closed). 415 `UnsupportedAttachmentType` for any other type (SVG too). 400 `InvalidAttachment` when the body is empty, the header of the file is not the one of its type, or `name` is empty. 400 `ImagesNotSupported` when the model does not read images. 409 `TooManyPendingAttachments` when the session has `aiChat.input.images.maxPendingPerSession` images that are in no message yet. An image that no message uses is deleted after 24 hours. 404 for a session that is not the one of the caller.'
      parameters:
        - name: name
          in: query
          required: true
          description: The name of the file. Control characters are removed, `/` and `\` become `_`, at most 255 characters. It is a label, never a path, and the type is never worked out from it.
          allowReserved: true
          schema:
            type: string
      responses:
        '201':
          description: The image is stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatAttachment'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
  /sessions/{id}/attachments/{attachmentId}:
    parameters:
      - $ref: '#/components/parameters/sessionId'
      - name: attachmentId
        in: path
        required: true
        description: ID of the image.
        schema:
          type: string
    get:
      operationId: readAttachment
      tags: [Attachments]
      summary: Read an image of a session.
      description: "Only the owner of the session reads it; any other caller, and an image of another session, gets 404. The answer has the type that was stored, `X-Content-Type-Options: nosniff`, `Content-Disposition: inline`, `Content-Security-Policy: default-src 'none'; sandbox`, `Cache-Control: private, no-cache` and an `ETag` (the SHA-256 of the bytes, quoted). Every request is checked first; `If-None-Match` with the `ETag` answers 304 for an image that still exists, and 404 for one that was deleted."
      responses:
        '200':
          description: The bytes of the image.
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
        '304':
          description: The image did not change.
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /sessions/{id}/runs:
    parameters:
      - $ref: '#/components/parameters/sessionId'
    post:
      operationId: sendMessage
      tags: [Runs]
      summary: Send a message, start a run and stream it.
      description: 409 while a run of the session has not ended (also one that waits for an approval), 503 while the backend shuts down. A message that is refused is not stored. A client that goes away does not stop the run. Empty text is accepted when attachmentIds has at least one image; a message with no text and no image is 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                  minLength: 0
                  maxLength: 8000
                  description: Empty when the message is only images. A message with no text and no image is refused.
                attachmentIds:
                  type: array
                  items:
                    type: string
                  description: Ids of uploaded images of this session, in the order to show them. At most `aiChat.input.images.maxPerMessage`; 400 when the model does not read images, when there are too many, or when one is not an image of this session (`AttachmentNotFound`).
                page:
                  $ref: '#/components/schemas/ChatPageContext'
              required: [text]
      responses:
        '200':
          $ref: '#/components/responses/Stream'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /sessions/{id}/runs/{runId}/cancel:
    parameters:
      - $ref: '#/components/parameters/sessionId'
      - $ref: '#/components/parameters/runId'
    post:
      operationId: cancelRun
      tags: [Runs]
      summary: Ask a run to stop.
      description: Returns at once; the run stops at its next step, and the results that are stored stay. 409 when the run has ended.
      responses:
        '202':
          description: The request to stop is stored.
          content:
            application/json:
              schema:
                type: object
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /sessions/{id}/runs/{runId}/messages:
    parameters:
      - $ref: '#/components/parameters/sessionId'
      - $ref: '#/components/parameters/runId'
    post:
      operationId: insertMessage
      tags: [Runs]
      summary: Add a message to the run that is running.
      description: 'The message is written to the log as an item with `delivery: inserted`, and the model reads it in its next call; no run starts and no stream opens. The answer is the item. Two outcomes only: the message is written, or the answer is 409. 409 `RunNotRunning` when the run waits for an approval, has ended, is not a run of this session, or has no live lease; 409 `InsertLimitReached` when the run has taken as many inserted messages as the configuration allows (`aiChat.input.insert.maxPerRun`). With images: 400 `TooManyImageBytes` when the images of the messages of the run, with this one, are over `aiChat.input.images.maxBytesPerInput`; nothing is written then. The model reads a message that comes in before the run ends; a run that is about to end reads it first. Empty text is accepted when attachmentIds has at least one image; a message with no text and no image is 400.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                  minLength: 0
                  maxLength: 8000
                  description: Empty when the message is only images. A message with no text and no image is refused.
                attachmentIds:
                  type: array
                  items:
                    type: string
                  description: Ids of uploaded images of this session, in the order to show them. At most `aiChat.input.images.maxPerMessage`; 400 when the model does not read images, when there are too many, or when one is not an image of this session (`AttachmentNotFound`).
                page:
                  $ref: '#/components/schemas/ChatPageContext'
              required: [text]
      responses:
        '201':
          description: The item that was written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMessageItem'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /sessions/{id}/queue:
    parameters:
      - $ref: '#/components/parameters/sessionId'
    get:
      operationId: listQueue
      tags: [Queue]
      summary: Read the queue of a session.
      description: The messages in the order they are sent, and whether the queue is paused (the session has no run that has not ended and the queue is not empty).
      responses:
        '200':
          description: The queue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatQueue'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    post:
      operationId: queueMessage
      tags: [Queue]
      summary: Queue a message for when the run ends.
      description: 'When the run ends the normal way (the model answered, no limit stopped it) and the credentials of the user last for another run, the first message of the queue starts a new run. 409 `NoActiveRun` when the session has no run that has not ended (send the message instead); 409 `QueueFull` at `aiChat.input.queue.maxMessages` messages. Empty text is accepted when attachmentIds has at least one image; a message with no text and no image is 400.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                  minLength: 0
                  maxLength: 8000
                  description: Empty when the message is only images. A message with no text and no image is refused.
                attachmentIds:
                  type: array
                  items:
                    type: string
                  description: Ids of uploaded images of this session, in the order to show them. At most `aiChat.input.images.maxPerMessage`; 400 when the model does not read images, when there are too many, or when one is not an image of this session (`AttachmentNotFound`).
                page:
                  $ref: '#/components/schemas/ChatPageContext'
              required: [text]
      responses:
        '201':
          description: The queued message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatQueuedMessage'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /sessions/{id}/queue/order:
    parameters:
      - $ref: '#/components/parameters/sessionId'
    put:
      operationId: reorderQueue
      tags: [Queue]
      summary: Set the order of the queue.
      description: '`ids` must be exactly the ids of the queue now; the messages then have the positions 1, 2, 3 in that order. 409 `QueueChanged` when another tab deleted or added a message, or the message was sent: read the queue again.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  maxItems: 100
                  items:
                    type: string
              required: [ids]
      responses:
        '200':
          description: The queue in the new order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatQueue'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /sessions/{id}/queue/resume:
    parameters:
      - $ref: '#/components/parameters/sessionId'
    post:
      operationId: resumeQueue
      tags: [Queue]
      summary: Send the first queued message now and stream its run.
      description: For a queue that is paused (`paused` of the queue). The run uses the credentials of this request; their remaining time is not checked. 204 when the queue is empty or the session has a run that has not ended. 503 while the backend shuts down.
      responses:
        '200':
          $ref: '#/components/responses/Stream'
        '204':
          $ref: '#/components/responses/NoContent'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /sessions/{id}/queue/{queuedId}:
    parameters:
      - $ref: '#/components/parameters/sessionId'
      - $ref: '#/components/parameters/queuedId'
    patch:
      operationId: updateQueuedMessage
      tags: [Queue]
      summary: Change a queued message.
      description: Only the fields in the body change; `page` as `null` removes the page. 404 `QueuedMessageNotFound` when the message was deleted or sent. 400 when the message would have no text and no image after the change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                  minLength: 1
                  maxLength: 8000
                attachmentIds:
                  type: array
                  items:
                    type: string
                  description: The ids of all the images the message keeps; one that is left out is released.
                page:
                  oneOf:
                    - $ref: '#/components/schemas/ChatPageContext'
                    - type: 'null'
      responses:
        '200':
          description: The queued message after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatQueuedMessage'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteQueuedMessage
      tags: [Queue]
      summary: Remove a queued message.
      description: 404 `QueuedMessageNotFound` when the message was deleted or sent.
      responses:
        '204':
          description: Removed.
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /sessions/{id}/tool-calls/{callId}/decision:
    parameters:
      - $ref: '#/components/parameters/sessionId'
      - $ref: '#/components/parameters/callId'
    post:
      operationId: decideToolCall
      tags: [Runs]
      summary: Allow or deny a call that waits, and carry the run on when it was the last one.
      description: The decision is stored at once. When other calls of the run still wait, or another request carries the run on, the answer is JSON. When this decision was the last one the run waited for and this request carried the run on, the answer is the stream of the run, which starts with `tool-approval-response`. The action runs the input that was stored, with the credentials of this request. A call that was decided already keeps its decision (the answer says which). 409 when the call does not wait or the run does not wait for an approval, 503 while the backend shuts down (the decision is stored, and another backend carries the run on). Only the owner can decide (404 for anyone else).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                approved:
                  type: boolean
                page:
                  $ref: '#/components/schemas/ChatPageContext'
              required: [approved]
      responses:
        '200':
          description: The decision that stands, when the answer is not a stream. When the run was carried on, the content type is `text/event-stream` (see `Stream`).
          content:
            application/json:
              schema:
                type: object
                properties:
                  approved:
                    type: boolean
                required: [approved]
            text/event-stream:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /sessions/{id}/resume:
    parameters:
      - $ref: '#/components/parameters/sessionId'
    post:
      operationId: resumeRun
      tags: [Runs]
      summary: Carry on a run that waits for an approval although every call has a decision.
      description: For a run whose last decision was stored and whose loop did not start (`resumable` of the session). It asks for no decision. 204 when there is nothing to carry on (no run, calls that still wait, another request got there first). 503 while the backend shuts down.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                page:
                  $ref: '#/components/schemas/ChatPageContext'
      responses:
        '200':
          $ref: '#/components/responses/Stream'
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /sessions/{id}/stream:
    parameters:
      - $ref: '#/components/parameters/sessionId'
    get:
      operationId: followSession
      tags: [Runs]
      summary: Join the run that is under way.
      description: 'The stream starts with `start` (the same message ID as the run), `data-run`, and the items of the run from its first one; then it goes on with the new events until the run ends. Each text arrives whole, when it is complete. Only a run that is `running` is streamed, and only by the backend that runs it; for a run that waits for an approval, a run that ended, no run, or a run of another backend the answer is 204. `afterSeq` leaves out the items up to it, for a client that does not use the AI SDK.'
      parameters:
        - $ref: '#/components/parameters/afterSeq'
      responses:
        '200':
          $ref: '#/components/responses/Stream'
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /sessions/{id}/tools:
    parameters:
      - $ref: '#/components/parameters/sessionId'
    get:
      operationId: listSessionTools
      tags: [Sessions]
      summary: List the tools that the session offers to the model.
      description: Listed with the credentials of the signed-in user, from the toolsets that are switched on in the session. Only the owner reads it; anyone else gets 404. The screen uses it to show a call with its title, its description and whether it changes anything.
      responses:
        '200':
          description: The tools.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ChatTool'
                required: [items]
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /toolsets:
    get:
      operationId: listToolsets
      tags: [Toolsets]
      summary: List the toolsets the administrator defined.
      description: The user switches these on or off in a session (`enabledToolsets`), and only these. `default` says whether a new session has the toolset switched on.
      responses:
        '200':
          description: The toolsets.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ChatToolset'
                required: [items]
        '403':
          $ref: '#/components/responses/Error'
